<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}2FA Auth{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: #f0f4f8;
        min-height: 100vh;
      }
      .card {
        border: none;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .navbar-brand {
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .totp-code {
        font-size: 2rem;
        letter-spacing: 0.4em;
        font-family: monospace;
      }
      .secret-box {
        background: #1e293b;
        color: #a5f3fc;
        font-family: monospace;
        font-size: 1.1rem;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5">
      <div class="container">
        <a class="navbar-brand" href="/">&#128272; 2FA Auth</a>
        <div class="ms-auto d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" href="/login">Login</a>
          <a
            class="btn btn-light btn-sm text-primary fw-semibold"
            href="/register"
            >Register</a
          >
        </div>
      </div>
    </nav>

    <div class="container pb-5">{% block content %}{% endblock %}</div>
  </body>
</html>
