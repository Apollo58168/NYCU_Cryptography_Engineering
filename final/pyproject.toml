[project]
name = "final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "uvicorn[standard]>=0.48.0",
    "fastapi",
]

[project.scripts]
pqc-audit = "pqc_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
